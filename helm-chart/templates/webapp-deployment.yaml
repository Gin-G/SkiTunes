apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.webapp.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.webapp.name }}
    group: {{ .Values.webapp.group }}
spec:
  replicas: {{ .Values.webapp.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.webapp.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.webapp.name }}
    spec:
      containers:
      - name: {{ .Values.webapp.name }}
        env:
        - name: FLASK_SECRET
          valueFrom:
            secretKeyRef:
              name: skitunes-esos
              key: flask-secret
        - name: SPOTIFY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: skitunes-esos
              key: spotify-client-id
        - name: SPOTIFY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: skitunes-esos
              key: spotify-client-secret
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: skitunes-esos
              key: google-client-id
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: skitunes-esos
              key: google-client-secret
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: skitunes-esos
              key: mail-password
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.db.name }}-app
              key: uri
        image: {{ .Values.webapp.container.image }}
        imagePullPolicy: {{ .Values.webapp.container.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.webapp.container.port }}
        resources:
          requests:
            cpu: 100m
            memory: 128Mi